version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@2.0.0

# Define your executors
executors:
  docker-executor:
    docker:
      - image: cimg/base:current
    working_directory: ~/repo

  # Executor for the fetch_issues and upload_to_gcs steps
  fetch_upload_executor:
    docker:
      - image: cimg/python:3.9
    working_directory: ~/repo

jobs:
  build_dependencies:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install dependencies and build project
          command: |
            sudo apt-get update && sudo apt-get install -y jq curl build-essential
            echo 'Hello SonarQube! List down all the required packages here'

      - persist_to_workspace:
          root: .
          paths:
            - .  # Persist the entire workspace for reuse


  sonar_cloud_scan:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - sonarcloud/scan
          # Using SonarCloud orb for analysis
          # token: $SONARQUBE_TOKEN
          # project_key: $PROJECT_KEY
          # organization: $SONARQUBE_ORG



  # Stage 2: Fetch issues from SonarCloud and save to file
  fetch_scanning_result:
    executor: fetch_upload_executor
    steps:
      - checkout
      - attach_workspace:
          at: .

      - run:
          name: Fetch issues from SonarCloud API
          command: |
            curl -u $SONARQUBE_TOKEN: "https://sonarcloud.io/api/issues/search?componentKeys=$PROJECT_KEY&ps=500" \
            -o issues.json

      - run:
          name: Display fetched issues
          command: cat issues.json

      - persist_to_workspace:
          root: .
          paths:
            - issues.json

  # Stage 3: Upload issues to Google Cloud Storage
  upload_to_gcp:
    executor: fetch_upload_executor
    steps:
      - checkout
      - attach_workspace:
          at: .
          
      - run:
          name: Display fetched issues
          command: cat issues.json

      - run:
          name: Install Google Cloud SDK
          command: |
            echo "Instal gsutil......"
            # curl -sSL https://sdk.cloud.google.com | bash
            # source $HOME/google-cloud-sdk/path.bash.inc
            # gcloud components install gsutil

      - run:
          name: Authenticate with Google Cloud
          command: |
            echo "Authenticate with google cloud"
            # echo $GCP_SERVICE_ACCOUNT_KEY | base64 --decode > /tmp/gcloud-service-key.json
            # gcloud auth activate-service-account --key-file=/tmp/gcloud-service-key.json
            # gcloud config set project $GCP_PROJECT_ID

      - run:
          name: Upload issues file to GCS
          command: |
            echo "Upload issues file to GCS"
            # gsutil cp /workspace/issues.json gs://$GCS_BUCKET_NAME/sonarqube-issues/$(date +'%Y-%m-%d')-issues.json
            # echo "Issues file uploaded to GCS"


workflows:
  main:
    jobs:
      - build:
          context: SonarCloud

      - sonar_cloud_scan:
          context: SonarCloud

      - fetch_scanning_result:
          context: SonarCloud
          requires: [build, sonar_cloud_scan]

      - upload_to_gcs:
          context: SonarCloud
          requires: [fetch_scanning_result]







